<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Healthcare Network">
  <defs>
    <linearGradient id="hn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12a374"/>
      <stop offset="1" stop-color="#06543b"/>
    </linearGradient>
    <linearGradient id="hn-cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d8f63"/>
      <stop offset="1" stop-color="#075c40"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect width="64" height="64" rx="16" fill="url(#hn-bg)"/>

  <!-- Network ring + nodes -->
  <circle cx="32" cy="34" r="22" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="12.95" cy="23" r="3.6" fill="#ffffff"/>
  <circle cx="51.05" cy="23" r="3.6" fill="#ffffff"/>
  <circle cx="32" cy="56" r="3.6" fill="#ffffff"/>

  <!-- Blood drop -->
  <path d="M32 9.5C32 9.5 18.5 25 18.5 36.5a13.5 13.5 0 0 0 27 0C45.5 25 32 9.5 32 9.5Z" fill="#ffffff"/>

  <!-- Medical cross -->
  <rect x="29.25" y="29.5" width="5.5" height="15" rx="1.6" fill="url(#hn-cross)"/>
  <rect x="24.5" y="34.25" width="15" height="5.5" rx="1.6" fill="url(#hn-cross)"/>
</svg>
